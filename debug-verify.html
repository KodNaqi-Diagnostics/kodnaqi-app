<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>تشخيص التفعيل الكامل</title>
<style>body{font-family:system-ui;padding:20px;background:#f8fafc;text-align:center;}
textarea{width:100%;height:100px;margin-bottom:10px;padding:10px;font-size:0.8rem;font-family:monospace;direction:ltr;border:2px solid #cbd5e1;border-radius:8px;box-sizing:border-box;}
button{padding:15px;font-size:1rem;background:#0d3b66;color:#fff;border:none;border-radius:8px;cursor:pointer;width:100%;margin-bottom:10px;font-weight:bold;}
button.red{background:#dc3545;}
#log{margin-top:20px;font-family:monospace;background:#0f172a;color:#a5f3fc;padding:15px;border-radius:8px;text-align:left;white-space:pre-wrap;display:none;font-size:0.8rem;line-height:1.6;}</style>
</head>
<body>
<h2>🔍 تشخيص التفعيل الكامل (verify)</h2>
<p style="color:#666;font-size:0.9rem;">هذه الصفحة تختبر دالة التفعيل بنفس طريقة التطبيق وتظهر النتيجة على الشاشة.</p>
<textarea id="licenseKey" placeholder="الصق المفتاح (KOD2...) هنا..."></textarea>
<button onclick="runVerify()">✅ اختبار التفعيل (Verify)</button>
<button class="red" onclick="clearAll()">🗑️ مسح كل البيانات (ترخيص + تجريبي)</button>
<div id="log"></div>

<script src="firebase-config.js"></script>
<script src="security.js"></script>
<script src="license.js"></script>
<script>
async function runVerify() {
  const key = document.getElementById('licenseKey').value.trim();
  const log = document.getElementById('log');
  log.style.display = 'block';
  if (!key) { log.innerText = '❌ الرجاء إدخال المفتاح'; return; }

  log.innerText = '⏳ جاري التحقق...\n\n';
  
  try {
    // استدعاء دالة verify الأصلية من license.js
    const result = await window.KodNaqiLicense.verify(key);
    
    log.innerText += '📋 نتيجة التفعيل:\n';
    log.innerText += '═══════════════════════\n';
    log.innerText += JSON.stringify(result, null, 2);
    log.innerText += '\n═══════════════════════\n\n';
    
    if (result.valid) {
      log.innerText += '✅ الترخيص صالح ومطابق!';
    } else {
      log.innerText += '❌ سبب الرفض: ' + (result.reason || 'غير معروف');
      if (result.reason === 'wrong_device') {
        log.innerText += '\n\n⚠️ المفتاح لجهاز آخر.\nالمفتاح يخص: ' + result.expected + '\nجهازك الحالي: ' + result.actual;
      }
    }
  } catch(e) {
    log.innerText += '❌ خطأ برمجي:\n';
    log.innerText += e.message + '\n' + e.stack;
  }
}

function clearAll() {
  localStorage.clear();
  indexedDB.deleteDatabase('kodnaqi_guard');
  if ('caches' in window) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }
  document.getElementById('log').style.display = 'block';
  document.getElementById('log').innerText = '✅ تم مسح كل البيانات المحلية. \nالآن أعد فتح التطبيق (localhost:8080) وستظهر شاشة الترحيب.';
}
</script>
</body>
</html>
