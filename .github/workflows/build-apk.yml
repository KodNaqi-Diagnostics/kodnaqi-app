name: Build KodNaqi APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode and Sign APK
        run: |
          # 1. Decode the keystore safely (using printf instead of echo to avoid newlines)
          printf "%s" "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/build/outputs/apk/debug/signingKey.jks || (echo "❌ Failed to decode SIGNING_KEY. Please check the secret." && exit 1)
          
          # 2. Verify file is not empty
          if [ ! -s android/app/build/outputs/apk/debug/signingKey.jks ]; then
            echo "❌ Decoded keystore is empty!"
            exit 1
          fi
          echo "✅ Keystore decoded successfully."

          # 3. Locate Build Tools
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          
          # 4. Sign the APK (Using PKCS12 format explicitly)
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/build/outputs/apk/debug/signingKey.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-type PKCS12 \
            --out android/app/build/outputs/apk/debug/app-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          
          echo "✅ APK Signed Successfully!"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KodNaqi-APK-Signed
          path: android/app/build/outputs/apk/debug/app-signed.apk
          if-no-files-found: error
          retention-days: 14
